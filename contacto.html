<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fervenza</title>
    
    <!-- Estilos xerais -->
    <link rel="stylesheet" href="estilos_xerais.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- (Opcional) Fuente tipográfica limpia de Google Fonts para darle un toque profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Hueco para el menú común -->
    <div id="contenedor-menu"></div>

    
    <style>
    .redes {
        display: flex;
        flex-direction: column; /* Coloca el título arriba y los iconos abajo */
        justify-content: center; /* Centra verticalmente si hay espacio */
        align-items: center; /* Centra horizontalmente */
        text-align: center;
        padding: 20px;
        background-color: var(--color-fondo-cabecera);
        color: rgb(29, 24, 24);
    }

    .redes h2 {
        margin-bottom: 15px; /* Espacio entre el título y los iconos */
    }

    .redes-links {
        display: flex;
        justify-content: center;
        gap: 20px; /* Separación más moderna entre los iconos en lugar de margin */
    }

    .redes-links a {
        color: rgb(7, 6, 6);
        text-decoration: none;

        margin: 0 20px; /* Espaciado horizontal entre los iconos */
        font-size: 3rem;
        transition: all 0.3s ease; /* Hace que el movimiento sea suave */
    }

    .redes-links a:hover {
        color: var(--color-acento);
        transform: translateY(-5px); /* Corregido: antes ponía transalateY */
    }
</style>
    <div class="tarjeta-contacto">
    <h2>Formulario de contacto</h2>
    <p>Se tes interés en militar con nós, ou simplemente queres saber máis sobre as nosas accións, non dubides en mandarnos un correo electrónico mediante o seguinte formulario. Tamén podes escribirnos directamente ao correo: <i>fervenza.estudantil@gmail.com</i>.</p>

    <!-- Usamos un servicio gratuito como Formspree (reemplaza TU_ENDPOINT_AQUÍ con tu enlace) -->
    <form action="https://formspree.io/f/meaogwjy" method="POST" class="formulario-contacto">
        
        <div class="grupo-formulario">
            <label for="nombre">O teu nome:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ex: Juan Pérez">
        </div>

        <div class="grupo-formulario">
            <label for="email">O teu correo electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="correo@exemplo.com">
        </div>

        <div class="grupo-formulario">
            <label for="mensaje">Contido:</label>
            <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe aquí a túa mensaxe"></textarea>
        </div>

        <button type="submit" class="btn-enviar">Enviar Mensaxe</button>
    </form>
</div>

<style>
    /* Estilos integrados con tu paleta */
    .tarjeta-contacto {
        background-color: var(--blanco);
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        margin: 40px auto;
    }
    .tarjeta-contacto h2 {
        color: var(--color-principal);
        margin-bottom: 10px;
    }
    .tarjeta-contacto p {
        color: var(--color-texto);
        margin-bottom: 25px;
    }
    .grupo-formulario {
        margin-bottom: 20px;
    }
    .grupo-formulario label {
        display: block;
        font-weight: bold;
        color: var(--color-principal);
        margin-bottom: 8px;
    }
    .grupo-formulario input,
    .grupo-formulario textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        background-color: #ffffff;
    }
    .grupo-formulario input:focus,
    .grupo-formulario textarea:focus {
        outline: none;
        border-color: var(--color-principal);
        box-shadow: 0 0 0 3px rgba(24, 130, 44, 0.15);
    }
    .btn-enviar {
        background-color: #496ea5;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
    .btn-enviar:hover {
        background-color: #12631f; /* Un verde un poco más oscuro para el hover */
    }
</style>
<div class="tarjeta-contacto redes">
    <h2>Redes Sociais</h2>
        <div class="redes-links">
            <a href="https://www.instagram.com/fervenza.estudantil" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.x.com/fervenza.estudantil" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
    </div>
    <div id="contenedor-footer"></div>
    <script src="scripts/xeral.js"></script>
</body>
</html>
